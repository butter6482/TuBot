name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest --cov=chatbot-saas-backend/app --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot-saas-frontend/Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js requires Node >= 22
          node-version: 22
          cache: npm
          cache-dependency-path: chatbot-saas-frontend/Frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only (no push): verifies the image still builds after every change.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tubot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
